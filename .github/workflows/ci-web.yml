name: CI · Web/API

on:
  # main push 始终跑全（集成闸门）
  push:
    branches: [main]
  # PR 只在 web/api 相关改动时跑；Swift-only 改动不触发
  pull_request:
    paths:
      - "apps/**"
      - "contracts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".npmrc"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    env:
      # Astro 在加载配置时就校验这些公开构建变量；干净 checkout 没有被忽略的 apps/web/.env。
      PUBLIC_SITE_URL: https://appidge.com
      # 生产仓库可配置真实 Polar link；fallback 仅为不部署的 CI 静态产物，避免伪装成真实 checkout。
      PUBLIC_POLAR_CHECKOUT_URL: ${{ vars.PUBLIC_POLAR_CHECKOUT_URL || 'https://checkout.example.invalid/appidge-ci' }}
      PUBLIC_API_BASE_URL: https://api.appidge.com
      PUBLIC_DOWNLOAD_URL: https://updates.appidge.com/appidge-latest.dmg
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check
