# apps/api/wrangler.toml — Appidge license facade Worker
# secrets (CREEM_API_KEY / CREEM_WEBHOOK_SECRET / LICENSE_HMAC_PEPPER) 走 `wrangler secret put`，
# 绝不写进本文件或 git。本地 dev 用 .dev.vars（git-ignored）。
name = "appidge-api"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# 非秘密的构建期配置。MOCK_MODE 默认开：本地/CI 用协议 mock，不触真实 Creem。
# 生产用 `wrangler deploy --var MOCK_MODE:false` 或 environment 覆盖，并注入真实 secret。
# CREEM_PRODUCT_ID 为非秘密标识，由部署者填入真实值。
[vars]
MOCK_MODE = "true"
CREEM_API_BASE = "https://test-api.creem.io"
CREEM_PRODUCT_ID = "prod_PLACEHOLDER_xxxxxxxx"
# 限速（滥用保护）：每 IP+路由 每窗口最大请求数 / 窗口毫秒。
RATE_LIMIT_MAX = "60"
RATE_LIMIT_WINDOW_MS = "60000"
# 请求体大小上限（字节）。
MAX_BODY_BYTES = "16384"

# D1：webhook 幂等 + entitlement/refund 状态。真实 database_id 由部署者填入并记录在
# infra/cloudflare。本地/测试用 miniflare 内置 D1，不需要真实 id。
[[d1_databases]]
binding = "DB"
database_name = "appidge-licensing"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# ── staging（测试预览）──────────────────────────────────────────────
# 自定义域：api-staging.appidge.com（custom_domain=true，wrangler 自动建 DNS+证书）。
# MOCK_MODE=false 打真实 Creem test API（base https://test-api.creem.io，key 前缀 creem_test_），
# 需 `wrangler secret put --env staging` 注入 CREEM_API_KEY/CREEM_WEBHOOK_SECRET/LICENSE_HMAC_PEPPER。
# Creem 后台 webhook 已指向 https://api-staging.appidge.com/v1/webhooks/creem。
[env.staging]
workers_dev = false

[[env.staging.routes]]
pattern = "api-staging.appidge.com"
custom_domain = true

[env.staging.vars]
MOCK_MODE = "false"
CREEM_API_BASE = "https://test-api.creem.io"
# test 模式产品（非秘密标识；测试支付链接 https://www.creem.io/test/payment/<product_id>）。
CREEM_PRODUCT_ID = "prod_19wdgqeFewovz4fWqITeaX"
RATE_LIMIT_MAX = "60"
RATE_LIMIT_WINDOW_MS = "60000"
MAX_BODY_BYTES = "16384"

# staging 专用 D1（与生产库隔离，区域 APAC）。
[[env.staging.d1_databases]]
binding = "DB"
database_name = "appidge-licensing-staging"
database_id = "2777a4a3-8e0f-4f39-af39-12aed0ceb63e"
migrations_dir = "migrations"

# ── production（正式）────────────────────────────────────────────────
# 自定义域：api.appidge.com（custom_domain=true，wrangler 自动建 DNS+证书）。
# MOCK_MODE 关，base 指向生产 Creem。secret 仍走 `wrangler secret put --env production`。
# ⚠️ CREEM_PRODUCT_ID 是 REQUIRED_ 占位（database_id 已回填真实值）——appidge-ops preflight
#    production 会 fail closed 并逐项列出；由用户提供真实 live product id 后才可部署（不猜测、不伪造）。
[env.production]
workers_dev = false

[[env.production.routes]]
pattern = "api.appidge.com"
custom_domain = true

[env.production.vars]
MOCK_MODE = "false"
CREEM_API_BASE = "https://api.creem.io"
# ▼ 待填（Creem live）：非秘密产品标识，webhook product 白名单据此过滤。
#   从哪拿：Creem Dashboard（live 模式）→ 目标产品 → product id（prod_ 前缀）。
#   填哪　：替换下面整个 "REQUIRED_..." 字符串（本行）。Creem 无需 org/benefit id（与 Polar 不同）。
#   配套：支付链接填 ops/environments/production.conf；上线清单 docs/prod-launch-checklist.md §5。
#   占位/空 → appidge-ops preflight production fail-closed，禁止伪造。
CREEM_PRODUCT_ID = "REQUIRED_CREEM_LIVE_PRODUCT_ID"
RATE_LIMIT_MAX = "60"
RATE_LIMIT_WINDOW_MS = "60000"
MAX_BODY_BYTES = "16384"

# production 专用 D1（与 staging 库隔离，区域 APAC）。2026-07-24 创建并回填真实 id。
[[env.production.d1_databases]]
binding = "DB"
database_name = "appidge-licensing-production"
database_id = "1db51c0e-9d4b-4b32-82f7-e02553508c11"
migrations_dir = "migrations"
