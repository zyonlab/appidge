# apps/api/wrangler.toml — Appidge license facade Worker
# secrets (POLAR_ACCESS_TOKEN / POLAR_WEBHOOK_SECRET / LICENSE_HMAC_PEPPER) 走 `wrangler secret put`，
# 绝不写进本文件或 git。本地 dev 用 .dev.vars（git-ignored）。
name = "appidge-api"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# 非秘密的构建期配置。MOCK_MODE 默认开：本地/CI 用协议 mock，不触真实 Polar。
# 生产用 `wrangler deploy --var MOCK_MODE:false` 或 environment 覆盖，并注入真实 secret。
# POLAR_ORGANIZATION_ID/PRODUCT_ID/BENEFIT_ID 为非秘密标识，由部署者填入真实值。
[vars]
MOCK_MODE = "true"
POLAR_API_BASE = "https://sandbox-api.polar.sh"
POLAR_ORGANIZATION_ID = "org_PLACEHOLDER_xxxxxxxx"
POLAR_PRODUCT_ID = "prod_PLACEHOLDER_xxxxxxxx"
POLAR_BENEFIT_ID = "ben_PLACEHOLDER_xxxxxxxx"
# 限速（滥用保护）：每 IP+路由 每窗口最大请求数 / 窗口毫秒。
RATE_LIMIT_MAX = "60"
RATE_LIMIT_WINDOW_MS = "60000"
# 请求体大小上限（字节）。
MAX_BODY_BYTES = "16384"

# D1：webhook 幂等 + entitlement/refund 状态。真实 database_id 由部署者填入并记录在
# infra/cloudflare。本地/测试用 miniflare 内置 D1，不需要真实 id。
[[d1_databases]]
binding = "DB"
database_name = "appidge-licensing"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# ── staging（测试预览）──────────────────────────────────────────────
# 自定义域：api-staging.appidge.com（custom_domain=true，wrangler 自动建 DNS+证书）。
# MOCK_MODE=false 打真实 Polar sandbox：需先填 POLAR_ORGANIZATION_ID/PRODUCT_ID/BENEFIT_ID，
# 并 `wrangler secret put --env staging` 注入 POLAR_ACCESS_TOKEN/POLAR_WEBHOOK_SECRET/LICENSE_HMAC_PEPPER。
[env.staging]
workers_dev = false

[[env.staging.routes]]
pattern = "api-staging.appidge.com"
custom_domain = true

[env.staging.vars]
MOCK_MODE = "false"
POLAR_API_BASE = "https://sandbox-api.polar.sh"
# 非秘密标识（access token / webhook secret 走 `wrangler secret put --env staging`，不入 git）。
POLAR_ORGANIZATION_ID = "63e7ed2c-c47a-4542-91f6-b04b74960206"
# sandbox 测试 product + License Keys benefit（非秘密标识）。
POLAR_PRODUCT_ID = "003ce8a1-4b8a-446a-992f-094d033b90c7"
POLAR_BENEFIT_ID = "f00313a0-2491-4654-84db-4b27dfeffa6a"
RATE_LIMIT_MAX = "60"
RATE_LIMIT_WINDOW_MS = "60000"
MAX_BODY_BYTES = "16384"

# staging 专用 D1（与生产库隔离，区域 APAC）。
[[env.staging.d1_databases]]
binding = "DB"
database_name = "appidge-licensing-staging"
database_id = "2777a4a3-8e0f-4f39-af39-12aed0ceb63e"
migrations_dir = "migrations"

# ── production（正式）────────────────────────────────────────────────
# 自定义域：api.appidge.com（custom_domain=true，wrangler 自动建 DNS+证书）。
# MOCK_MODE 关，base 指向生产 Polar。secret 仍走 `wrangler secret put --env production`。
# ⚠️ POLAR_*_ID 与 database_id 仍是占位——appidge-ops preflight production 会 fail closed
#    并逐项列出；由用户提供真实值后才可部署（不猜测、不伪造）。
[env.production]
workers_dev = false

[[env.production.routes]]
pattern = "api.appidge.com"
custom_domain = true

[env.production.vars]
MOCK_MODE = "false"
POLAR_API_BASE = "https://api.polar.sh"
POLAR_ORGANIZATION_ID = "org_PLACEHOLDER_xxxxxxxx"
POLAR_PRODUCT_ID = "prod_PLACEHOLDER_xxxxxxxx"
POLAR_BENEFIT_ID = "ben_PLACEHOLDER_xxxxxxxx"
RATE_LIMIT_MAX = "60"
RATE_LIMIT_WINDOW_MS = "60000"
MAX_BODY_BYTES = "16384"

# production 专用 D1（与 staging 库隔离）。database_id 为占位：由用户
# `wrangler d1 create appidge-licensing-production` 后回填（preflight 在此之前 fail closed）。
[[env.production.d1_databases]]
binding = "DB"
database_name = "appidge-licensing-production"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
