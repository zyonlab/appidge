# 这个站发布什么，以及每一类出现在哪些位置。
#
# 引擎【提供】内容类型，这个文件决定【发布】哪些。没在这里声明的类型就是不发布——
# 这是站点拒绝一个类型的方式，不用删引擎里的任何东西。
#
# 我们只发一种：文章。骨架自带的 videos / projects / case-studies 已经删掉——
# 每一个都会产出一个空归档页，对读者没用，对搜索引擎是薄内容，还会被 C-04 判成
# 孤儿页。要写视频或案例时，在这里加回来就行，引擎那半边一直都在。
#
# `surfaces`：省略某一项就是"不出现在那里"。
#   nav      主导航里的排序权重
#   home     首页上的分区（limit = 显示条数，order = 分区之间的顺序）
#   rss      进 /rss.xml
#   llms     进 /llms.txt，按 limit 截断  ← 给 AI 摘要读的那一面
#   sitemap  默认 true
#
# 走查：aifb docs/recipes/add-content-type.md

posts:
  # route 就是 URL 段：/zh/blog/writing/<slug>/。BRIEF 已冻结这个结构，不要改。
  route: writing
  label: 文章
  # 引擎的首页按钮是「查看全部{listTitle}」，这里填「全部文章」会得到
  # 「查看全部全部文章」。填名词即可。
  listTitle: 文章
  listDescription: 按进程分流这件事上踩过的坑和查过的故障。三个方向：软件为什么不走代理、 Appidge 自己怎么用、以及 macOS 代理生态里那些工具各自的边界。
  surfaces:
    nav: 10
    home: { limit: 6, order: 20 }
    rss: true
    llms: { limit: 12 }
    sitemap: true
