# 固定页的文案。
#
# 站点主人写的内容，不是 UI 词条：换个主人是重写这份，不是翻译它。
# 这就是它住在 site/ 而不是 engine/i18n/ 的原因。
#
# 只保留我们发布的两个页面。about / newsletter / uses / workWithMe 已删——
# astro.config.mjs 的 `pages: ['topics','series']` 已经声明不发布它们，
# 未发布的页面不需要文案（引擎文档：a page the site does not publish needs no copy）。
# 关于我们、联系方式这些，宿主官网自己有，博客不该在 /zh/blog 下再开一套。
#
# description 守 160 显示列上限（C-06）。有下限，但不要朝着下限写——
# 为凑长度加的从句一句都不值。

topics:
  title: 主题
  description: >-
    三个方向：软件为什么不走代理、Appidge 怎么用、以及 macOS 代理生态里那些工具的边界。
    按你现在卡在哪里挑一个。

series:
  title: 系列
  description: >-
    有先后顺序的几篇，按顺序读比单看一篇更有用。目前只有一条：按软件类别排查"这东西
    为什么不走代理"。
