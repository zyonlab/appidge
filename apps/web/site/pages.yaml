# Copy for the static pages.
#
# Site-owner content, not UI chrome: a new owner rewrites this rather than
# translating it. That is why it lives here and not in engine/i18n/.
# The dividing line: docs/specs/site-config-contract.md
#
# Keep descriptions under the 160 display-column ceiling (rule C-06). There is a
# floor too, but do not write toward it — padding a sentence to clear a
# threshold is how an earlier version of this file ended up with trailing
# clauses that said nothing.

topics:
