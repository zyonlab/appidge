# Brand and identity — yours to decide.
#
# Every TODO below is a decision the pipeline will not make for you:
# `pnpm validate` refuses to run until they are gone. That is deliberate —
# a canonical URL, a category system and a voice are cheap to choose now and
# expensive to change once articles exist.
#
# Want a worked example instead of a blank form?
#   cp -r examples/agent-native-engineer/site/. site/
#
# Contract: docs/specs/site-config-contract.md

# 与宿主官网同名。博客不是独立品牌，它是 appidge.com 的一部分。
name: Appidge
# /zh/blog/ 这一页自己的 <title>（不走 titleTemplate）。35 显示列，C-05 上限 60。
title: Appidge 博客 · 按进程分流的排查笔记
# /zh/blog/ 的 meta description，也是 llms.txt 的开头。131 显示列，C-06 要求 36–160。
# 口径继承 src/config/site.ts 的 SITE_TAGLINE：说"转发到你自己的代理"，不说"代理工具"。
description: macOS 上按进程决定每条连接走直连、走你自己的上游代理，还是拦截。这里记录 Appidge 的用法、常见故障的排查过程，以及周边工具踩过的坑。

# canonical origin。**构建时 PUBLIC_SITE_URL 覆盖它**（引擎 config/site.ts 实测：
# `import.meta.env.PUBLIC_SITE_URL ?? process.env.PUBLIC_SITE_URL ?? url`），
# 所以 staging 构建拿到的是 staging 域名，这里只是兜底值。
url: https://appidge.com

# Must have a matching engine/i18n/<locale>.ts. Shipped: zh-CN, en-US.
# How every page title is composed. {title} is the page's own title.
# The suffix costs columns out of the ~60 a search result shows (rule C-05):
# with a long site name, '{title}' alone is often the better choice.
titleTemplate: '{title} · {name}'

locale: zh-CN

# Publishing in more than one language? Uncomment `locales` — the default above
# stays at the root and every other one is served under its prefix:
#
#   /            /writing/       zh-CN
#   /en/         /en/writing/    en-US
#
# Translations go in content/<type>/en/, paired by `translationKey`. Copy is
# translated by an `i18n:` block on any mapping in site/. Leave this out and the
# site is one language, exactly as before. See docs/specs/i18n.md.
#
# locales:
#   zh-CN: zh
#   en-US: en

theme:
  # site/themes/appidge.css —— 官网 21 个 token 到引擎全量 token 集的映射。
  name: appidge
  # 官网是单一浅色，博客同理。引擎的内联主题脚本只读 localStorage、不读
  # prefers-color-scheme，加上 ThemeToggle 被空覆盖掉，所以这里就是最终长相。
  defaultMode: light
  # 浏览器 chrome 色。preflight 会核对它等于主题 :root 的 --bg（不等会在移动端
  # 首屏渲染前露出一条色缝）。两个模式同值，因为主题的两个 block 本来就同值。
  colorDark: '#ffffff'
  colorLight: '#ffffff'
  # localStorage key for the mode toggle. Change it so two sites on one domain
  # do not fight over the same light/dark preference.
  # 宿主官网是单一浅色（global.css 里 color-scheme: light），不存任何主题偏好，
  # 所以这个 key 只属于博客，不会跟官网抢。
  storageKey: appidge-blog-theme

og:
  # 复用官网已有的 OG 图（public/og.png，1200×630 raster）。
  # 引擎会检查这个文件真实存在，所以不能指向骨架自带的 /og-default.png——我们没有那个文件。
  default: /og.png

brand:
  initial: A
  # 口径与 src/config/site.ts 的 SITE_TAGLINE 一致：说"转发到你自己的代理"，
  # 不说"代理工具"——后者读起来像"我们就是代理"，与"不提供节点"的红线自相矛盾。
  tagline: 按进程把流量转发到你自己的代理
  # 进 About 页与结构化数据。写读者会搜的词，不是我们内部的说法。
  keywords:
    - macOS 按进程分流
    - 透明代理
    - 软件不走代理
    - Network Extension
    - Proxifier 替代

# 署名到团队而不是个人：这个博客写的是产品自己的排查经验，署名对象就是做它的人，
# 且不必把某个人的姓名/私人邮箱放进公开的结构化数据。
# email 用官网早已公开的 support@appidge.com（Footer、退款政策、隐私政策都在用），
# 不新增任何对外暴露的联系方式。
author:
  name: Appidge 团队
  title: macOS 网络工具开发
  bio: 我们做 Appidge —— macOS 上的按进程透明代理。它在系统网络层接管进程流量，按你的规则决定每条连接走直连、走你自己的上游代理，还是拦截。这个博客记录它怎么用、出问题时怎么查，以及一路踩过的坑。
  email: support@appidge.com

# Profile URLs, published as `sameAs` in the Person schema. Omit a network
# rather than pointing at its home page — a bare domain claims an identity it
# does not prove.
social: {}

# /zh/blog/ 的首屏。读者多半是被搜索引擎丢进某一篇文章的，会点到这里的人是
# "这篇有用，他们还写了什么"——所以首屏说清楚这个站按什么归档，而不是再推销一次产品。
# actions 的 href 写引擎路由的原样（/writing/），引擎会自动补 mount 前缀。
hero:
  eyebrow: Appidge 博客
  title: 那个软件为什么不走代理
  description: >-
    macOS 上代理配了、系统代理也设了，可总有软件当没看见。这里按软件的类别讲清楚每一种
    为什么会这样，怎么让它归你的规则管；顺带记录 Appidge 自己怎么用，以及这套生态里
    各个工具的边界在哪。
  signals:
    - 只写实际查过的故障，不写没验证过的猜测
    - 出口永远是你自己配的上游 —— 我们不提供节点
    - 透明代理，不改路由表、不接管 DNS
    - 中文，面向 macOS 上的开发者

# 没有 services 块：/work-with-me/ 不在 engine({ pages }) 白名单里，这个站不接活。
# 引擎对 services 的每个字段都有默认值（config/site.ts 的 `?? ''`），删掉是安全的。

# Static navigation. Content types register themselves via `surfaces.nav` in
# site/content-types.yaml; `order` interleaves the two lists.
#
# 只留引擎实际注入的两个归档页。about / work-with-me 我们在 astro.config.mjs 的
# `pages: ['topics','series']` 里已经声明不发布——nav 是站点自己写的，引擎不会替我们
# 删（它只对"是引擎路由"的 href 补 mount 前缀，不是引擎路由的原样保留）。留着就是
# 指向不存在页面的死链，check-site.mjs 第 3 条会红。
nav:
  - { href: /series/, label: Series, order: 20 }
  - { href: /topics/, label: Topics, order: 30 }
