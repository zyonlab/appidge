# What this site is about — yours to decide.
#
# The `category` vocabulary is derived from the topic keys, so there is nothing
# to keep in sync. A topic key is also the URL of its page and the `category`
# of every article using it: renaming one later means rewriting frontmatter and
# leaving dead URLs behind. Decide them before writing, not after.
#
# Worked example: examples/agent-native-engineer/site/taxonomy.yaml
#
# Contract: docs/specs/taxonomy.md

