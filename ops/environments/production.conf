# ops/environments/production.conf —— production 环境的公开构建/部署配置。
# 只放可提交的非秘密值；任何 token/secret 走 wrangler secret / .env（git-ignored）。
# 契约与校验规则：docs/claude-code-staging-production-free-plan.md §5。
# ⚠️ REQUIRED_* 是显式人工闸门占位：appidge-ops preflight production 会 fail closed
#    并列出缺失项。不要为通过校验伪造真实值。
APPIDGE_ENVIRONMENT='production'

# 官网（apps/web）构建期公开配置
PUBLIC_SITE_URL='https://appidge.com'
# 官网「购买」CTA 的公开支付链接（Creem live，2026-07-26 由用户提供并回填）。
#   来源　：Creem Dashboard（live 模式）→ 目标产品 → Share / Payment Link。
#   格式　：host 必须是 creem.io，形如 https://www.creem.io/payment/prod_xxx，【不得含 /test/】。
#   一致性：链接尾部 product id 必须与 apps/api/wrangler.toml [env.production.vars] 的
#           CREEM_PRODUCT_ID 相同（webhook product 白名单据此过滤）。
#   变量名沿用 PUBLIC_POLAR_CHECKOUT_URL（改名列为后续债务，见 docs/creem-integration.md §8）。
PUBLIC_POLAR_CHECKOUT_URL='https://www.creem.io/payment/prod_3DHsihYJeOAhNDOT0Wo0LV'
PUBLIC_API_BASE_URL='https://api.appidge.com'
PUBLIC_DOWNLOAD_URL='https://updates.appidge.com/appidge-latest.dmg'

# macOS App（scripts/archive-and-notarize.sh 经 appidge-ops build-macos 注入）
LICENSE_API_BASE_URL='https://api.appidge.com'
# 单页信息架构下 /pricing 独立页已撤（aef5a5d），落地页是首页 #pricing 锚点。
LICENSE_CHECKOUT_URL='https://appidge.com/#pricing'
SPARKLE_FEED_URL='https://updates.appidge.com/appcast.xml'
# 官网基址（App 内跳转官网页面的根地址，与 PUBLIC_SITE_URL/LICENSE_CHECKOUT_URL 同源）
SITE_BASE_URL='https://appidge.com'
# 免费试用天数（production 固定 7）
TRIAL_DURATION_DAYS='7'

# Cloudflare D1（名称非秘密；id 在 apps/api/wrangler.toml，占位时 preflight 失败）
API_D1_DATABASE_NAME='appidge-licensing-production'
