# ops/environments/staging.conf —— staging 环境的公开构建/部署配置。
# 只放可提交的非秘密值；任何 token/secret 走 wrangler secret / .env（git-ignored）。
# 契约与校验规则：docs/claude-code-staging-production-free-plan.md §5。
APPIDGE_ENVIRONMENT='staging'

# 官网（apps/web）构建期公开配置
PUBLIC_SITE_URL='https://staging.appidge.com'
# Creem test 模式支付链接（公开链接，非 API key）。变量名沿用 PUBLIC_POLAR_CHECKOUT_URL
# —— 改名牵动 apps/web 构建与 check-site（另一 agent 所有权），列为后续债务，见 docs/creem-integration.md。
PUBLIC_POLAR_CHECKOUT_URL='https://www.creem.io/test/payment/prod_19wdgqeFewovz4fWqITeaX'
PUBLIC_API_BASE_URL='https://api-staging.appidge.com'
PUBLIC_DOWNLOAD_URL='https://updates-staging.appidge.com/appidge-latest.dmg'

# macOS App（scripts/archive-and-notarize.sh 经 appidge-ops build-macos 注入）
LICENSE_API_BASE_URL='https://api-staging.appidge.com'
# staging 直接给 Creem test 支付链接，方便测试机上直达 test 结账（production 仍指官网定价页）
LICENSE_CHECKOUT_URL='https://www.creem.io/test/payment/prod_19wdgqeFewovz4fWqITeaX'
SPARKLE_FEED_URL='https://updates-staging.appidge.com/appcast.xml'

# Cloudflare D1（名称非秘密；id 在 apps/api/wrangler.toml）
API_D1_DATABASE_NAME='appidge-licensing-staging'
