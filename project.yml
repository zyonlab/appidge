name: appidge
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  # UI 源语言是中文;String Catalog(App/Localizable.xcstrings)以 zh-Hans 为源、含 en 翻译。
  developmentLanguage: zh-Hans

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  Core:
    path: Packages/Core
  IPCContract:
    path: Packages/IPCContract
  EngineKit:
    path: Packages/EngineKit
  AppFeature:
    path: Packages/AppFeature
  # Sparkle 2 自动更新(只链接进 App target,Extension 绝不链接;见 CLAUDE.md §5.6)。
  # 必须声明在这里而不是手工改 pbxproj——工程由 xcodegen 从本文件重生成,手工改动会被冲掉
  # (2026-07-26 实锤:曾手工加的 Sparkle 引用在一次 regenerate 中丢失导致 build 失败)。
  # 版本钉在 Package.resolved(2.9.4);这里的 from 只是兼容下界。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0

settingGroups:
  common:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.35"
    CURRENT_PROJECT_VERSION: "36"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    GENERATE_INFOPLIST_FILE: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  App:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: appidge
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: appidge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(PROVISIONING_PROFILE_SPECIFIER_APP)
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
    dependencies:
      - package: Core
      - package: IPCContract
      - package: AppFeature
      - package: Sparkle
      - target: ProxyExtension
        embed: true
    scheme:
      testTargets: []
      gatherCoverageData: false

  ProxyExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: Extension
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: $(EXT_BUNDLE_IDENTIFIER)
        PRODUCT_BUNDLE_IDENTIFIER: $(EXT_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: ProxyExtension
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(PROVISIONING_PROFILE_SPECIFIER_EXT)
        SKIP_INSTALL: NO
        # —— 扩展版本与 app build 号解耦（升级黑洞的根本缓解）——
        # macOS 按 (short, build) 元组判断系统扩展是否需要替换；替换窗口正是「会话绑死旧
        # provider / XPC 监听器注册失败」竞态的唯一入口。扩展内容没变的发版保持这两个值
        # 不动 → 系统跳过替换 → 竞态窗口不存在。Extension/Info.plist 读的是这两个变量
        # （不是 CURRENT_PROJECT_VERSION——那个会被 archive-and-notarize.sh 按 app build 号
        # 命令行注入、覆盖所有 target）。改了 Extension/、EngineKit、IPCContract 必须 bump
        # APPIDGE_EXT_BUILD_NUMBER 并跑 scripts/check-extension-version.sh --update；
        # 出包前置闸门（archive-and-notarize.sh §0.6）会对内容指纹硬校验兜底。
        APPIDGE_EXT_MARKETING_VERSION: "0.2.35"
        APPIDGE_EXT_BUILD_NUMBER: "82"   # 82: 连接字节周期回填 + UDP 计量(改了 Extension/EngineKit)
    dependencies:
      - package: EngineKit
      - package: IPCContract

schemes:
  App:
    build:
      targets:
        App: all
        ProxyExtension: all
    run:
      config: Debug
    archive:
      config: Release
